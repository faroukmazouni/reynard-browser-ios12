name: Build iOS 12 Impactor IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios12-impactor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check Xcode 15 project and share extension
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Select Xcode 15.4 and check the project
        run: |
          test -d /Applications/Xcode_15.4.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -list -project browser/Reynard.xcodeproj
          xcodebuild build -project browser/Reynard.xcodeproj -target OpenIn \
            -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  engine:
    name: Build Gecko with the newer SDK
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 360
    # MOZ_AUTOMATION specifically means Mozilla Taskcluster. Defining it in
    # GitHub Actions makes local toolchain bootstrap require a nonexistent
    # Taskcluster TASK_ID, so it must remain absent (even "0" is incorrect).
    env:
      GECKO_BUILD_JOBS: "2"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Select Xcode 26.6 and check both Gecko SDK requirements
        run: |
          test -d /Applications/Xcode_26.6.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun clang --version
          host_sdk="$(xcrun --sdk macosx --show-sdk-version)"
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          python3 -c 'import sys; parse = lambda value: tuple(map(int, value.split("."))); assert parse(sys.argv[1]) >= (26, 4), "Gecko needs macOS SDK >= 26.4"; assert parse(sys.argv[2]) >= (18, 4), "Gecko needs iOS SDK >= 18.4"' "$host_sdk" "$ios_sdk"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          rustup default stable
      - name: Make space on the temporary build machine
        run: |
          test "$GITHUB_ACTIONS" = true
          # Retain Xcode 26.6. These named unused installations belong to the
          # disposable CI machine; these commands never run on the user's Mac.
          for unused_xcode in \
            /Applications/Xcode_26.5.app /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app; do
            if [ -d "$unused_xcode" ] && [ ! -L "$unused_xcode" ]; then
              sudo rm -rf "$unused_xcode"
            fi
          done
          df -h
          available_kb="$(df -k . | awk 'END { print $4 }')"
          if [ "$available_kb" -lt 31457280 ]; then
            echo "::error::Firefox needs at least 30 GB free. Use a runner with more storage."
            exit 1
          fi
      - name: Fetch and patch the pinned Firefox release
        run: |
          mkdir -p dist/ci-logs
          set -o pipefail
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh < /dev/null 2>&1 | tee dist/ci-logs/patches.log
      - name: Build Gecko targeting iOS 12.0
        run: |
          set -o pipefail
          ./tools/development/build-gecko.sh 2>&1 | tee dist/ci-logs/gecko.log
      - name: Package only the engine distribution and default theme
        run: |
          tar -chzf dist/gecko-ios12.tar.gz \
            engine/firefox/obj-aarch64-apple-ios/dist/include \
            engine/firefox/obj-aarch64-apple-ios/dist/bin \
            engine/firefox/toolkit/mozapps/extensions/default-theme
      - uses: actions/upload-artifact@v4
        with:
          name: gecko-ios12-distribution
          path: dist/gecko-ios12.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload engine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS12-engine-logs
          path: |
            dist/ci-logs/
            engine/firefox/obj-aarch64-apple-ios/config.log
          if-no-files-found: ignore
          retention-days: 7

  app:
    name: Build Swift app and validate the IPA
    needs: engine
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Select Xcode 15.4 for Swift and final linking
        run: |
          test -d /Applications/Xcode_15.4.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: gecko-ios12-distribution
          path: dist
      - name: Restore Gecko and build the device library
        run: |
          mkdir -p dist/ci-logs
          tar -xzf dist/gecko-ios12.tar.gz
          git submodule update --init --depth 1 --recursive support/idevice
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          rustup default stable
          set -o pipefail
          ./tools/development/build-idevice.sh 2>&1 | tee dist/ci-logs/idevice.log
      - name: Build unsigned archive and package IPA
        run: |
          set -o pipefail
          ./tools/release/build-ios12-impactor.sh 2>&1 | tee dist/ci-logs/archive.log
          ./tools/release/create-ios12-impactor-ipa.sh 2>&1 | tee dist/ci-logs/package.log
      - uses: actions/upload-artifact@v4
        with:
          name: Reynard-iOS12-Impactor
          path: dist/ios12-impactor/Reynard-iOS12-Impactor.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload app diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS12-app-logs
          path: dist/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
